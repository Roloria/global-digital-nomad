name: 📝 数据更新 / 纠错
description: 更新某座城市的数据（成本、游民数、网速、签证……），或指出错误
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        感谢共建！每一笔更新都会进入 git 历史。**带来源的更新优先处理**——一手体感也算来源。
        > 💡 也可以直接在 [腾讯文档共建表](https://docs.qq.com/sheet/DREppWERNRWdwcXRR) 编辑，无需开 Issue。
  - type: input
    id: city
    attributes:
      label: 城市 / 国家
      placeholder: "清迈 / 泰国"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 更新已有字段（成本/游民数/气温/签证…）
        - 纠错（数据错误/过期）
        - 其他
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 改什么
      placeholder: |
        字段：月成本 (USD)
        当前值：1100
        建议值：1250
        原因/来源：2026 年 8 月起市中心一居室租金上涨……
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 来源（可选但强烈建议）
      placeholder: 链接，或「本人 2026-08 起在当地居住」
