name-template: '🌍 v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels: ['breaking', 'breaking-change', 'major']
  minor:
    labels: ['feature', 'feat', 'enhancement', 'data', 'new-city']
  patch:
    labels: ['fix', 'bugfix', 'bug', 'chore', 'docs', 'ci', 'typo', 'dependencies']
  default: patch

categories:
  - title: '🚀 新功能 & 数据更新'
    labels:
      - 'feature'
      - 'feat'
      - 'enhancement'
      - 'data'
      - 'new-city'
      - 'new-feature'
    collapse-after: 30

  - title: '🐛 Bug 修复'
    labels:
      - 'fix'
      - 'bug'
      - 'bugfix'
    collapse-after: 30

  - title: '📚 文档'
    labels:
      - 'docs'
      - 'documentation'
    collapse-after: 30

  - title: '🔧 维护 & CI'
    labels:
      - 'chore'
      - 'ci'
      - 'maintenance'
      - 'dependencies'
    collapse-after: 30

  - title: '⚠️ 重大变更'
    labels:
      - 'breaking'
      - 'breaking-change'
      - 'major'
    collapse-after: 0

  - title: '❓ 其他改动'
    labels:
      - '*'
    collapse-after: 50

exclude-labels:
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
template: |
  ## 🌍 全球数字游民计划 — v$RESOLVED_VERSION

  $CHANGES

  ---

  **🔗 相关链接**：
  - [完整变更历史]($REPO_URL/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION)
  - [查看 release]($REPO_URL/releases/tag/v$RESOLVED_VERSION)

  **🤝 贡献者**：$CONTRIBUTORS

  ---

  🤖 *本 release 由 [release-drafter](https://github.com/release-drafter/release-drafter) 自动生成*
