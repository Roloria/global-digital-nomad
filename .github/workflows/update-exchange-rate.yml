name: Update USD→CNY Exchange Rate

on:
  # 每月 1 号 00:00 UTC 跑一次
  schedule:
    - cron: '0 0 1 * *'
  # 也支持手动触发(方便调试/补跑)
  workflow_dispatch:
  # 允许在工作流文件本身变动时立即跑一次(便于初次部署)
  push:
    paths:
      - '.github/workflows/update-exchange-rate.yml'

permissions:
  contents: write

jobs:
  update-rate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Query USD→CNY rate
        id: fetch
        env:
          API_URL: https://open.er-api.com/v6/latest/USD
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)
          echo "📅 today (UTC): $TODAY"
          
          # Try primary API
          HTTP=$(curl -sS -o /tmp/rate.json -w "%{http_code}" --max-time 15 "$API_URL" || echo "000")
          if [ "$HTTP" != "200" ]; then
            echo "⚠️ primary API failed (HTTP $HTTP), trying fallback frankfurter.app"
            HTTP2=$(curl -sS -o /tmp/rate.json -w "%{http_code}" --max-time 15 "https://api.frankfurter.app/latest?from=USD&to=CNY" || echo "000")
            if [ "$HTTP2" != "200" ]; then
              echo "❌ both APIs failed, aborting"
              exit 1
            fi
            SOURCE="frankfurter.app"
          else
            SOURCE="open.er-api.com"
          fi

          # Primary API uses .rates.CNY, frankfurter uses .rates.CNY at top level
          RATE=$(jq -r '.rates.CNY' /tmp/rate.json)
          if [ "$RATE" = "null" ] || [ -z "$RATE" ]; then
            echo "❌ cannot parse CNY rate from /tmp/rate.json"
            cat /tmp/rate.json
            exit 1
          fi
          echo "✅ $SOURCE reports 1 USD = $RATE CNY"
          echo "rate=$RATE" >> $GITHUB_OUTPUT
          echo "source=$SOURCE" >> $GITHUB_OUTPUT
          echo "today=$TODAY" >> $GITHUB_OUTPUT

      - name: Update exchange-rate.json
        run: |
          mkdir -p docs/data
          cat > docs/data/exchange-rate.json <<JSON
          {
            "base": "USD",
            "target": "CNY",
            "rate": ${{ steps.fetch.outputs.rate }},
            "updated_at": "${{ steps.fetch.outputs.today }}",
            "source": "${{ steps.fetch.outputs.source }}",
            "note": "auto-updated by GitHub Action · schedule: monthly (0 0 1 * *)"
          }
          JSON
          echo "📝 wrote docs/data/exchange-rate.json:"
          cat docs/data/exchange-rate.json

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/exchange-rate.json

          if git diff --cached --quiet; then
            echo "ℹ️ no rate change this run, skipping"
            exit 0
          fi

          OLD=$(jq -r '.rate // "n/a"' docs/data/exchange-rate.json 2>/dev/null || echo "n/a")
          NEW=${{ steps.fetch.outputs.rate }}
          git commit -m "chore(rate): USD→CNY $OLD → $NEW (auto-update ${{ steps.fetch.outputs.today }})"

          # 尝试直接 push;若分支保护拒绝(保护规则要求 PR review),
          # 则 fallback 到 PR 流程,需要 maintainer 在 Settings → Branches 把
          # github-actions[bot] 加到 "Allow specified actors to bypass" 中以实现完全自动。
          if git push origin main 2>&1; then
            echo "✅ direct push succeeded"
          else
            echo "⚠️ direct push blocked by branch protection; falling back to PR"
            BRANCH="auto/rate-${{ steps.fetch.outputs.today }}"
            git branch -M main "$BRANCH" || git checkout -b "$BRANCH"
            git push origin "$BRANCH" --force
            BODY=$(printf "🤖 自动汇率更新\\n\\n- 1 USD = \`%s\` CNY (从 %s)\\n- 更新时间: %s\\n- 触发原因: scheduled / workflow_dispatch\\n\\n> 此 PR 由 GitHub Action 创建。如需完全自动化,请在 Settings → Branches → main → \"Allow specified actors to bypass\" 中将 \`github-actions[bot]\` 加进去。" "$NEW" "${{ steps.fetch.outputs.source }}" "${{ steps.fetch.outputs.today }}")
            gh pr create --base main --head "$BRANCH" --title "🤖 自动汇率更新 ${{ steps.fetch.outputs.today }} · 1 USD = ¥$NEW" --body "$BODY" --label "automated,exchange-rate" 2>&1 || echo "PR create failed; please run gh pr create manually"
          fi
