:root[data-theme=&quot;light&quot;] {

}

h3,
h4,
h5,

}

b,
strong,
th {

}

}

.table-responsive &gt; .table :is(th, td) {

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.card {

  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

}

  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );

  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);

  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {

  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));

}

  gap: 2px;

.viz-stat-value {

  align-items: center;
  gap: 10px;
}

  background: var(--accent);

}

  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);

.viz-controls {

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  gap: 2px 12px;

.btn,

.btn {

  min-height: 28px;

a.btn {

  text-decoration: none;
}

.btn:not(:disabled):hover {

.btn-primary {

  color: var(--primary-foreground);
  background: var(--foreground);

}

.btn-primary .text-muted {

.form-label {

  margin-bottom: 6px;

  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

.form-control:disabled,
.form-select:disabled {

    d.overall = +( (d.internet*1.0 + d.community*1.2 + d.fun*1.0 + d.safety*1.2 + d.english*0.9 + d.air*0.7 + d.female*0.8 + d.lgbt*0.6 + d.walk*0.7 + d.nightlife*0.5 + d.peace*0.6 + d.racial*0.6) / 11.8 ).toFixed(1);
  });

  let currentRegion = &quot;All&quot;;
  let currentSearch = &quot;&quot;;
  let sortKey = &quot;nomads&quot;;
  let sortDir = -1;
  let expanded = null;

  function tierClass(v){ if(v&gt;=7) return &#x27;g&#x27;; if(v&gt;=5.5) return &#x27;m&#x27;; return &#x27;b&#x27;; }
  function costClass(c){ if(c&lt;=1100) return &#x27;cost-low&#x27;; if(c&lt;=2000) return &#x27;cost-mid&#x27;; return &#x27;cost-high&#x27;; }
  function fmt(n){ return n.toLocaleString(); }

  function filtered(){
    let list = unique;
    if(currentRegion !== &quot;All&quot;) list = list.filter(d =&gt; d.region === currentRegion);
    if(currentSearch){
      const q = currentSearch.toLowerCase();
      list = list.filter(d =&gt; d.city.toLowerCase().includes(q) || d.country.toLowerCase().includes(q));
    }
    list.sort((a,b) =&gt; {
      let av = a[sortKey], bv = b[sortKey];
      if(typeof av === &#x27;string&#x27;) { av = av.toLowerCase(); bv = bv.toLowerCase(); }
      if(av &lt; bv) return -1 * sortDir;
      if(av &gt; bv) return 1 * sortDir;
      return 0;
    });
    return list;
  }

  function renderStats(){
    document.getElementById(&#x27;stat-cities&#x27;).textContent = unique.length;
    const cheapest = [...unique].sort((a,b)=&gt;a.cost-b.cost)[0];
    const priciest = [...unique].sort((a,b)=&gt;b.cost-a.cost)[0];
    const biggest = [...unique].sort((a,b)=&gt;b.nomads-a.nomads)[0];
    const top = [...unique].sort((a,b)=&gt;b.overall-a.overall)[0];
    document.getElementById(&#x27;stat-cheapest&#x27;).textContent = &#x27;$&#x27;+cheapest.cost;
    document.getElementById(&#x27;stat-priciest&#x27;).textContent = &#x27;$&#x27;+priciest.cost;
    document.getElementById(&#x27;stat-biggest&#x27;).textContent = fmt(biggest.nomads);
    document.getElementById(&#x27;stat-top&#x27;).textContent = top.overall;
  }

  function barHTML(value, max){
    const pct = Math.min(100, (value/max)*100);
    const cls = tierClass(value);
    return `&lt;div class=&quot;nm-bar ${cls}&quot;&gt;&lt;span style=&quot;width:${pct}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;score-num&quot;&gt;${value}&lt;/span&gt;`;
  }

  function rowHTML(d, i){
    const expandedAttr = (expanded === i) ? &#x27;expanded&#x27; : &#x27;&#x27;;
    const detailRow = (expanded === i) ? `
      &lt;tr class=&quot;nm-detail-row&quot;&gt;&lt;td colspan=&quot;10&quot; class=&quot;nm-detail-cell&quot;&gt;
        &lt;div class=&quot;nm-detail-grid&quot;&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;网络速度&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.internet}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.internet,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;5G/Wi-Fi 普及与稳定性&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;社群活跃&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.community}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.community,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;Meetup/Coworking/线下活动&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;生活品质&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.fun}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.fun,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;餐厅/娱乐/文化体验&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;安全&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.safety}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.safety,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;治安与夜间安全感&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;英语环境&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.english}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.english,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;日常英语沟通便利度&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;步行友好&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.walk}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.walk,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;步道/基础设施/便利&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;空气质量&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.air}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.air,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;PM2.5 / 综合污染指数&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;女性友好&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.female}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.female,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;性别平等与安全性&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;LGBTQ+&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.lgbt}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.lgbt,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;多元包容与社会氛围&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;夜生活&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.nightlife}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.nightlife,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;酒吧/俱乐部/夜间活力&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;安静指数&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.peace}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.peace,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;噪音/拥挤度/可专注性&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;种族包容&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.racial}/10&lt;/div&gt;&lt;div class=&quot;mbar&quot;&gt;${barHTML(d.racial,10).replace(/&lt;span class=&quot;score-num&quot;&gt;.*?&lt;\/span&gt;/,&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;对外来人口接受度&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;年均气温&lt;/div&gt;&lt;div class=&quot;mvalue&quot;&gt;${d.temp}°C&lt;/div&gt;&lt;div class=&quot;mdesc&quot;&gt;最佳月份：${d.best}&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;nm-metric-card&quot;&gt;&lt;div class=&quot;mlabel&quot;&gt;签证提示&lt;/div&gt;&lt;div class=&quot;mvalue&quot; style=&quot;font-size:13px; font-weight:600;&quot;&gt;${d.visa}&lt;/div&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/td&gt;&lt;/tr&gt;` : &#x27;&#x27;;
    return `
      &lt;tr class=&quot;${expandedAttr}&quot; data-i=&quot;${i}&quot;&gt;
        &lt;td&gt;&lt;span class=&quot;nm-pill ${regionPillClass[d.region]}&quot;&gt;${regionMap[d.region]}&lt;/span&gt;&lt;/td&gt;
        &lt;td&gt;&lt;div class=&quot;city-cell&quot;&gt;&lt;div class=&quot;city-flag&quot;&gt;${d.flag}&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;city-name&quot;&gt;${d.city}&lt;/div&gt;&lt;div class=&quot;city-country&quot;&gt;${d.country}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;
        &lt;td style=&quot;text-align:right; font-weight:600;&quot;&gt;${fmt(d.nomads)}&lt;/td&gt;
        &lt;td style=&quot;text-align:right;&quot; class=&quot;${costClass(d.cost)}&quot;&gt;$${fmt(d.cost)}&lt;/td&gt;
        &lt;td&gt;${barHTML(d.internet,10)}&lt;/td&gt;
        &lt;td&gt;${barHTML(d.community,10)}&lt;/td&gt;
        &lt;td&gt;${barHTML(d.fun,10)}&lt;/td&gt;
        &lt;td&gt;${barHTML(d.safety,10)}&lt;/td&gt;
        &lt;td&gt;${barHTML(d.english,10)}&lt;/td&gt;
        &lt;td&gt;&lt;strong style=&quot;color:#0ea5e9&quot;&gt;${d.overall}&lt;/strong&gt;&lt;/td&gt;
      &lt;/tr&gt;
      ${detailRow}`;
  }

  function render(){
    const list = filtered();
    const tbody = document.getElementById(&#x27;nm-tbody&#x27;);
    if(!list.length){
      tbody.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;10&quot;&gt;&lt;div class=&quot;nm-empty&quot;&gt;没有匹配的城市&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
      return;
    }
    tbody.innerHTML = list.map(rowHTML).join(&#x27;&#x27;);
    tbody.querySelectorAll(&#x27;tr[data-i]&#x27;).forEach(tr =&gt; {
      tr.addEventListener(&#x27;click&#x27;, () =&gt; {
        const i = parseInt(tr.getAttribute(&#x27;data-i&#x27;));
        expanded = (expanded === i) ? null : i;
        render();
      });
    });
    // Update sort arrows
    document.querySelectorAll(&#x27;th[data-sort]&#x27;).forEach(th =&gt; {
      const arrow = th.querySelector(&#x27;.arrow&#x27;);
      if(th.getAttribute(&#x27;data-sort&#x27;) === sortKey){
        arrow.textContent = sortDir &gt; 0 ? &#x27;↑&#x27; : &#x27;↓&#x27;;
      } else {
        arrow.textContent = &#x27;↕&#x27;;
      }
    });
  }

  function renderTabs(){
    const tabsEl = document.getElementById(&#x27;region-tabs&#x27;);
    const regions = [&quot;All&quot;,&quot;Asia&quot;,&quot;Europe&quot;,&quot;LATAM&quot;,&quot;Africa&quot;,&quot;MiddleEast&quot;];
    tabsEl.innerHTML = regions.map(r =&gt; `&lt;button class=&quot;nm-tab ${currentRegion===r?&#x27;active&#x27;:&#x27;&#x27;}&quot; data-region=&quot;${r}&quot;&gt;${regionMap[r]}&lt;/button&gt;`).join(&#x27;&#x27;);
    tabsEl.querySelectorAll(&#x27;button&#x27;).forEach(b =&gt; {
      b.addEventListener(&#x27;click&#x27;, () =&gt; { currentRegion = b.getAttribute(&#x27;data-region&#x27;); expanded = null; renderTabs(); render(); });
    });
  }

  function bindSort(){
    document.querySelectorAll(&#x27;th[data-sort]&#x27;).forEach(th =&gt; {
      th.addEventListener(&#x27;click&#x27;, () =&gt; {
        const k = th.getAttribute(&#x27;data-sort&#x27;);
        if(sortKey === k) sortDir *= -1;
        else { sortKey = k; sortDir = (k === &#x27;city&#x27; || k === &#x27;region&#x27;) ? 1 : -1; }
        render();
      });
    });
  }

  document.getElementById(&#x27;nm-search&#x27;).addEventListener(&#x27;input&#x27;, e =&gt; {
    currentSearch = e.target.value;
    expanded = null;
    render();
  });

  renderStats();
  renderTabs();
  bindSort();
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
