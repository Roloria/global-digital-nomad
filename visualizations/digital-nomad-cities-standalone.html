@media (prefers-color-scheme: dark) {

    --border: #2a3654;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --text-3: #64748b;
    --accent: #38bdf8;
    --accent-2: #818cf8;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Noto Color Emoji&quot;, sans-serif;
  color: var(--text);
  background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
  line-height: 1.5;
  min-height: 100vh;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  padding: 28px 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 6px 24px rgba(14, 165, 233, 0.18);
}
header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 700; }
header .tagline { font-size: 14px; opacity: 0.92; }
header .links { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
header .links a { color: white; text-decoration: none; padding: 4px 10px; background: rgba(255,255,255,0.18); border-radius: 999px; transition: background 0.15s; }
header .links a:hover { background: rgba(255,255,255,0.3); }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 7px 14px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-size: 13px; cursor: pointer; color: var(--text-2); transition: all 0.15s; user-select: none; }
.tab:hover { border-color: var(--accent); color: var(--accent); }
.tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; border-color: transparent; font-weight: 600; }

.controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.search {
  flex: 1; min-width: 180px; max-width: 320px; padding: 8px 14px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 14px;
}
.search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.18); }
.select, .range-input {
  padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 14px;
}
.range-input { width: 100px; }
.btn {
  padding: 8px 16px; border-radius: 10px; border: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: transform 0.1s, box-shadow 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14,165,233,0.3); }
.btn:active { transform: translateY(0); }
.btn-secondary { background: var(--card); color: var(--accent); border: 1px solid var(--accent); }
.btn-secondary:hover { background: var(--accent); color: white; }

/* Currency segmented toggle */
.currency-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; background: var(--card); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--text-2); }
.currency-toggle .seg { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; cursor: pointer; color: var(--text-2); transition: all 0.15s; user-select: none; font-weight: 500; font-size: 12px; }
.currency-toggle .seg:hover { color: var(--accent); }
.currency-toggle .seg.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white; font-weight: 600; }
.currency-toggle .rate { color: var(--text-3); font-variant-numeric: tabular-nums; margin-left:4px; }
.currency-toggle .rate b { color: var(--text-2); font-weight: 600; cursor: help; }
@media (max-width: 720px) { .currency-toggle { padding: 3px 4px 3px 8px; font-size: 11px; } .currency-toggle .seg { padding: 3px 7px; } }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.stat .l { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; }
.stat .v { font-size: 22px; font-weight: 700; color: var(--text); margin-top: 4px; }
.stat .s { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead { background: var(--bg-2); }
th { text-align: left; padding: 10px 12px; font-weight: 600; color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { background: var(--bg-2); filter: brightness(0.95); }
th .arrow { font-size: 10px; color: var(--text-3); margin-left: 4px; }
td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr { cursor: pointer; transition: background 0.12s; }
tbody tr:hover { background: var(--bg-2); }
tbody tr.expanded { background: rgba(14,165,233,0.06); }
tbody tr:nth-child(even) { background: rgba(0,0,0,0.015); }
tbody tr:nth-child(even):hover { background: var(--bg-2); }

.city-cell { display: flex; align-items: center; gap: 10px; }
.city-flag { font-size: 22px; line-height: 1; font-family: &quot;Apple Color Emoji&quot;, &quot;Segoe UI Emoji&quot;, &quot;Noto Color Emoji&quot;, &quot;Twemoji&quot;, sans-serif; }
.city-name { font-weight: 600; color: var(--text); }
.city-country { font-size: 11px; color: var(--text-3); }
.num { font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
.rank { font-weight: 700; color: var(--accent); width: 36px; white-space: nowrap; }

/* 气温列:数字 + 小号 °C 单位 */
td.temp { font-variant-numeric: tabular-nums; font-weight: 500; }
td.temp &gt; span { margin-left: 1px; }

/* 季节列:文本,可 nowrap 截断 */
td.season { font-size: 12px; color: var(--text-2); max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { width: 70px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.bar &gt; span { display: block; height: 100%; border-radius: 3px; }
.bar.g &gt; span { background: linear-gradient(90deg, var(--good), #34d399); }
.bar.m &gt; span { background: linear-gradient(90deg, var(--mid), #fbbf24); }
.bar.b &gt; span { background: linear-gradient(90deg, var(--bad), #f87171); }

.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.pill.亚洲 { background: #fef3c7; color: #92400e; }
.pill.欧洲 { background: #dbeafe; color: #1e40af; }
.pill.拉美 { background: #fce7f3; color: #9d174d; }
.pill.非洲 { background: #d1fae5; color: #065f46; }
.pill.中东 { background: #ede9fe; color: #5b21b6; }

.detail-row td { background: var(--bg-2); padding: 18px 22px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.metric-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.metric-card .ml { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.3px; }
.metric-card .mv { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 2px; }
.metric-card .md { font-size: 11px; color: var(--text-2); margin-top: 4px; line-height: 1.4; }

.cost-low { color: var(--good); font-weight: 600; }
.cost-mid { color: var(--mid); font-weight: 600; }
.cost-high { color: var(--bad); font-weight: 600; }

.empty { text-align: center; padding: 40px; color: var(--text-3); font-size: 14px; }

footer { margin-top: 30px; padding: 20px 0; font-size: 12px; color: var(--text-3); text-align: center; line-height: 1.7; }
footer a { color: var(--accent); text-decoration: none; }

/* ==== Modal ==== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
  display: none; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); border-radius: 14px; max-width: 760px; width: 100%;
  max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
.modal-header {
  padding: 20px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; background: var(--card); z-index: 1;
}
.modal-header h2 { margin: 0; font-size: 18px; }
.modal-header .close {
  width: 32px; height: 32px; border-radius: 8px; border: none;
  background: var(--bg-2); color: var(--text-2); cursor: pointer;
  font-size: 18px; line-height: 1;
}
.modal-body { padding: 20px 24px; }
.guide-box {
  background: linear-gradient(135deg, rgba(14,165,233,0.08), rgba(99,102,241,0.08));
  border: 1px solid rgba(14,165,233,0.2);
  border-radius: 10px; padding: 14px 16px; margin-bottom: 18px;
  font-size: 13px; color: var(--text-2);
}
.guide-box h3 { margin: 0 0 8px; color: var(--text); font-size: 14px; }
.guide-box ul { margin: 6px 0 0; padding-left: 20px; }
.guide-box li { margin: 3px 0; }
.form-section { margin-bottom: 22px; }
.form-section h3 {
  margin: 0 0 12px; font-size: 14px; color: var(--text);
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.form-row label { font-size: 12px; color: var(--text-2); font-weight: 600; }
.form-row label .required { color: var(--bad); }
.form-row .hint { font-size: 11px; color: var(--text-3); line-height: 1.4; margin-top: 2px; }
.form-row input, .form-row select, .form-row textarea {
  padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 14px;
  font-family: inherit;
}
.form-row input:focus, .form-row select:focus, .form-row textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(14,165,233,0.15);
}
.form-row textarea { resize: vertical; min-height: 80px; line-height: 1.5; }

.score-row {
  display: grid; grid-template-columns: 110px 1fr 60px; gap: 10px;
  align-items: center; padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.score-row:last-child { border-bottom: none; }
.score-row .score-label { font-size: 13px; font-weight: 600; color: var(--text); }
.score-row .score-help { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.score-row .score-input { display: flex; flex-direction: column; gap: 2px; }
.score-row .score-input .lbl { font-size: 11px; color: var(--text-3); font-weight: 600; }
.score-row input[type=&quot;range&quot;] { width: 100%; }
.score-row .score-val {
  font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
  padding: 4px 0; border-radius: 6px;
}

.modal-footer {
  padding: 16px 24px; border-top: 1px solid var(--border);
  display: flex; gap: 10px; justify-content: flex-end;
  position: sticky; bottom: 0; background: var(--card);
}

.success-box {
  background: linear-gradient(135deg, rgba(16,185,129,0.1), rgba(16,185,129,0.04));
  border: 1px solid rgba(16,185,129,0.3);
  border-radius: 10px; padding: 16px; margin-bottom: 14px;
}
.success-box h4 { margin: 0 0 8px; color: var(--good); }
.action-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ==== Top-level View Tabs ==== */
.view-tabs {
  display: flex; gap: 0;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px;
  margin-bottom: 18px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.view-tab {
  flex: 1; min-width: 0;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 18px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: var(--text-2);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  text-decoration: none;
}
.view-tab:hover { color: var(--accent); background: var(--bg-2); }
.view-tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  box-shadow: 0 4px 14px rgba(14,165,233,0.25);
}
.view-tab .badge {
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 999px;
  background: rgba(255,255,255,0.25);
}
.view-tab:not(.active) .badge {
  background: var(--bg-2); color: var(--text-3);
}
.view {
  display: none;
  animation: viewFade 0.25s ease-out;
}
.view.active { display: block; }
@keyframes viewFade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
@media (max-width: 480px) {
  .view-tabs { padding: 4px; }
  .view-tab { padding: 9px 10px; font-size: 13px; gap: 4px; }
  .view-tab .badge { display: none; }
}
/* ==== Communities Section ==== */
#communities { scroll-margin-top: 80px; }
.community-header {
  background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(14,165,233,0.10));
  border: 1px solid rgba(99,102,241,0.25);

  padding: 22px 24px;
  margin-bottom: 18px;
}
.community-header h2 {
  margin: 0 0 8px;
  font-size: 20px;
  display: flex; align-items: center; gap: 8px;
}
.community-header .ctag {
  display: inline-flex; align-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white; padding: 3px 9px; border-radius: 999px;
  font-size: 11px; font-weight: 600;
  margin-left: auto;
}
.community-header p { margin: 6px 0 0; font-size: 13px; color: var(--text-2); line-height: 1.6; }
.community-header .cta-row {
  display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px;
}

.community-controls {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;

}
.community-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.community-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex; flex-direction: column;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;

.community-card:hover {

}
.community-card .cc-head {
  display: flex; align-items: flex-start; gap: 10px;
  margin-bottom: 10px;
}
.community-card .cc-flag {
  font-size: 26px; line-height: 1;
  font-family: &quot;Apple Color Emoji&quot;,&quot;Segoe UI Emoji&quot;,&quot;Noto Color Emoji&quot;,sans-serif;
  flex-shrink: 0;
}
.community-card .cc-titles {
  flex: 1; min-width: 0;
}
.community-card .cc-name {
  font-size: 15px; font-weight: 700; color: var(--text);
  line-height: 1.3;
}
.community-card .cc-name-en {
  font-size: 11px; color: var(--text-3); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.community-card .cc-score {
  flex-shrink: 0;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: white;
  font-weight: 700; font-size: 16px;
  border-radius: 10px;
  padding: 4px 9px;
  font-variant-numeric: tabular-nums;

}
.community-card .cc-meta {

}
.community-card .cc-type {
  display: inline-block;
  padding: 2px 8px; border-radius: 999px;

}
.cc-type.联合办公 { background: #dbeafe; color: #1e40af; }
.cc-type.联合生活 { background: #fce7f3; color: #9d174d; }
.cc-type.度假村 { background: #d1fae5; color: #065f46; }

  .cc-type.联合生活 { background: rgba(157,23,77,0.30); color: #fbcfe8; }
  .cc-type.度假村 { background: rgba(6,95,70,0.30); color: #a7f3d0; }

.community-card .cc-loc {

}
.community-card .cc-loc .pill { font-size: 10px; padding: 1px 6px; }

}
.community-card .cc-fields {

/* Mobile-first responsive design */
@media (max-width: 480px) {
  .container { padding: 10px; }
  header { padding: 16px 16px; border-radius: 10px; }
  header h1 { font-size: 18px; }
  header .tagline { font-size: 12px; }
  header .links { gap: 6px; }
  header .links a { font-size: 11px; padding: 3px 8px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { padding: 10px 12px; }
  .stat .v { font-size: 18px; }
  .stat .l { font-size: 10px; }
  .stat .s { font-size: 11px; }
  .tabs { gap: 4px; margin-bottom: 10px; }
  .tab { padding: 5px 10px; font-size: 12px; }
  .controls { gap: 6px; }
  .search, .select { font-size: 13px; padding: 7px 10px; }
  .search { min-width: 0; max-width: none; width: 100%; flex-basis: 100%; }
  .btn { font-size: 13px; padding: 7px 12px; width: 100%; justify-content: center; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; position: relative; }
  .table-wrap::after {
    content: &quot;← 横向滑动查看更多 →&quot;;
    display: block;
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: var(--text-3);
    background: var(--bg-2);
    border-top: 1px solid var(--border);
  }
  /* 表格:右边阴影渐变提示横向有更多列 */
  .table-wrap { background:
    linear-gradient(to right, var(--card) 30%, rgba(255,255,255,0)) 0 0 / 20px 100% no-repeat,
    linear-gradient(to right, rgba(255,255,255,0), var(--card) 70%) 100% 0 / 20px 100% no-repeat,
    var(--card);
    background-attachment: local, local, scroll;
  }
  .table-wrap::-webkit-scrollbar { height: 4px; }
  .table-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  table { min-width: 900px; font-size: 13px; }
  th, td { padding: 8px 9px; }
  .bar { width: 50px; }
  .form-grid { grid-template-columns: 1fr; }
  .score-row { grid-template-columns: 80px 1fr 45px; font-size: 11px; gap: 8px; }
  .score-row .score-help { display: none; }
  .modal-header { padding: 14px 18px; }
  .modal-header h2 { font-size: 15px; }
  .modal-body { padding: 14px 18px; }
  .modal-footer { padding: 12px 18px; flex-wrap: wrap; }
  .modal-footer .btn { flex: 1; }
  #methodology, #about, #faq { padding: 14px 16px; }
  #methodology h2, #about h2, #faq h2 { font-size: 16px; }
  footer { font-size: 11px; padding: 14px 0; }

  /* 汇率切换器:在手机端隐藏冗长的 meta(自动/时间/API),
     只保留币种按钮 + 汇率值,避免 4 行折行 */
  .currency-toggle { padding: 3px 5px; gap: 4px; flex-shrink: 0; }
  .currency-toggle #rate-meta, .currency-toggle .rate-meta { display: none !important; }
  .currency-toggle .seg { padding: 3px 8px; font-size: 11px; }
  /* 给 .rate 一个简化版,只显示 1 USD ≈ X.XX */
  .currency-toggle .rate &gt; b { display: inline; }

  /* 手机控件区 controls:紧凑,搜索全宽,其他元素内联 */
  .controls { row-gap: 8px !important; }

  /* 顶部 header 主链接:容许堆 2 行 */
  header .links { row-gap: 6px; }

  /* 移动端隐藏 「最近更新」列(主表+展开行),减少横向滚动 */
  #main-table thead th:last-child, #main-table tbody td:last-child { display: none; }
  #main-table tbody tr.detail-row td { padding: 12px 4px; }

  /* 详情面板「最近更新」也隐藏(表格里已不再展示) */
  .detail-row .meta-update { display: none; }

  /* 提交按钮文字在手机端缩短 */
  #btn-submit { font-size: 12px; padding: 8px 10px; }
  #btn-submit::before { content: &quot;📤&quot;; margin-right: 4px; }
  #link-submit { font-size: 11px; }

  /* detail-grid 在极窄屏缩窄最小卡宽 */
  .detail-grid { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)) !important; }
}

@media (min-width: 481px) and (max-width: 720px) {
  .container { padding: 12px; }
  header { padding: 20px 18px; }
  header h1 { font-size: 20px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat .v { font-size: 20px; }
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { min-width: 900px; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .score-row .score-help { display: none; }
  .search { min-width: 0; flex: 1; }
  .btn { width: auto; }
}

@media (min-width: 721px) and (max-width: 1024px) {
  .stats { grid-template-columns: repeat(3, 1fr); }
}

&lt;div id=&quot;faq&quot; style=&quot;margin-top:30px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px;&quot;&gt;
  &lt;h2 style=&quot;margin:0 0 14px; font-size:18px;&quot;&gt;❓ 常见问题(SEO / AEO 友好)&lt;/h2&gt;
  &lt;details style=&quot;margin-bottom:8px; padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;什么是数字游民城市排名?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;本榜单从月成本、网络、社群、生活、安全、英语、步行、空气、女性友好、LGBTQ+、夜生活、安静指数、种族包容共 12 个维度对全球 80 个城市加权评分,综合分越高越适合数字游民长期居住。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-bottom:8px; padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;排名前十的数字游民城市有哪些?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;综合分 TOP 10 包括:里斯本(葡萄牙)、柏林(德国)、台北(台湾)、东京(日本)、新加坡(新加坡)、上海(中国)、拉斯帕尔马斯(西班牙)、塔林(爱沙尼亚)、布拉格(捷克)、大理(中国)。详见上面榜单。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-bottom:8px; padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;如何申请数字游民签证?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;每个国家签证要求不同,常见条件包括月收入门槛(通常 2000-3500 USD)、健康保险、无犯罪记录证明等。葡萄牙 D7/D8、西班牙数字游民签证、爱沙尼亚数字游民签证、捷克游民签证是较热门选项。本榜单每个城市行末的「签证」字段会标注当前推荐签证类型,具体申请请以当地移民局官网为准。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-bottom:8px; padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;数字游民最便宜的城市是哪个?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;本榜单中月成本最低的城市包括清迈(泰国)、胡志明(越南)、金边(柬埔寨)、暹粒(柬埔寨),月生活成本约 800-1100 美元,适合预算有限的远程工作者。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;数据多久更新一次?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;本项目由开源社区维护,没有强制更新周期。任何用户都可以通过页面顶部的「📤 提交城市评分(匿名)」按钮提交更新,PR 合并后对应城市「最后更新」字段会自动刷新。&lt;/p&gt;
  &lt;/details&gt;
  &lt;details style=&quot;margin-top:8px; padding:10px 14px; background:var(--bg-2); border-radius:8px;&quot;&gt;
    &lt;summary style=&quot;cursor:pointer; font-weight:600; font-size:14px;&quot;&gt;🌐 怎么找到数字游民社区?怎么匿名分享体验?&lt;/summary&gt;
    &lt;p style=&quot;margin:10px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;下方的 &lt;b&gt;🌐 数字游民社区地图&lt;/b&gt;板块收录了全球 60 个热门社区(联合办公 45 / 联合生活 9 / 度假村 3 / 聚会 1 / 在线 2),可按区域 / 类型筛选。所有社区的位置、月费、政策、官网、联系邮箱都已结构化整理。&lt;/p&gt;
    &lt;p style=&quot;margin:8px 0 0; font-size:13px; color:var(--text-2); line-height:1.6;&quot;&gt;点「📤 分享社区体验(匿名)」按钮即可提交你的真实体验:&lt;b&gt;无需 GitHub 账号 / 无需本地存储&lt;/b&gt; — 提交直接 POST 到服务端 Cloudflare Worker,自动创建 GitHub Issue,完成后你拿到的就是真实的 Issue 链接。&lt;/p&gt;
  &lt;/details&gt;
&lt;/div&gt;

&lt;div id=&quot;about&quot; style=&quot;margin-top:30px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px;&quot;&gt;
  &lt;h2 style=&quot;margin:0 0 12px; font-size:18px;&quot;&gt;📖 关于本站 / 数据更新频率说明&lt;/h2&gt;
  &lt;p style=&quot;margin:0 0 14px; color:var(--text-2); font-size:13px;&quot;&gt;本站由开源社区协作维护，所有评分、签证与成本数据都公开可追溯（GitHub）。下面回答最常见的三个问题：&lt;/p&gt;

  &lt;div style=&quot;display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px;&quot;&gt;
    &lt;div style=&quot;padding:14px 16px; background:var(--bg-2); border-radius:10px; border:1px solid var(--border);&quot;&gt;
      &lt;div style=&quot;font-size:13px; font-weight:600; margin-bottom:6px;&quot;&gt;🔄 更新频率&lt;/div&gt;
      &lt;div style=&quot;font-size:12px; color:var(--text-2); line-height:1.6;&quot;&gt;
        没有强制周期。&lt;b&gt;任何&lt;/b&gt;读者都能通过页面顶部的「📤 提交城市评分(匿名)」按钮提交更新，PR 合并后该城市「最后更新」即被刷新。
        重大变更会在 &lt;a href=&quot;https://github.com/Roloria/global-digital-nomad/discussions&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;GitHub Discussions&lt;/a&gt; 公告。
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div style=&quot;padding:14px 16px; background:var(--bg-2); border-radius:10px; border:1px solid var(--border);&quot;&gt;
      &lt;div style=&quot;font-size:13px; font-weight:600; margin-bottom:6px;&quot;&gt;📅 数据新鲜度怎么看&lt;/div&gt;
      &lt;div style=&quot;font-size:12px; color:var(--text-2); line-height:1.6;&quot;&gt;
        列表每行城市名旁都有一个 &lt;code&gt;📅 YYYY-MM-DD&lt;/code&gt; 徽章，详情面板也会再列一遍。点击表头的「最近更新」列即可排序，第一眼就能看出哪些城市数据更旧。
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div style=&quot;padding:14px 16px; background:var(--bg-2); border-radius:10px; border:1px solid var(--border);&quot;&gt;
      &lt;div style=&quot;font-size:13px; font-weight:600; margin-bottom:6px;&quot;&gt;🧮 「最后更新」怎么算&lt;/div&gt;
      &lt;div style=&quot;font-size:12px; color:var(--text-2); line-height:1.6;&quot;&gt;
        由 &lt;code&gt;git blame&lt;/code&gt; 自动追溯数据行最后一次被修改的日期，&lt;b&gt;不是手动填写&lt;/b&gt;，没法&quot;假装新鲜&quot;。今天下方显示的统计基于 64 座城市实时计算：
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;about-stats&quot; style=&quot;display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-top:14px;&quot;&gt;&lt;/div&gt;

  &lt;div style=&quot;margin-top:16px; padding:14px 16px; background:linear-gradient(135deg, rgba(245,158,11,0.08), rgba(239,68,68,0.06)); border:1px solid rgba(245,158,11,0.25); border-radius:10px;&quot;&gt;
    &lt;div style=&quot;font-size:13px; font-weight:600; margin-bottom:6px;&quot;&gt;⚠️ 使用前请留意&lt;/div&gt;
    &lt;ul style=&quot;margin:0; padding-left:20px; font-size:12px; color:var(--text-2); line-height:1.7;&quot;&gt;
      &lt;li&gt;&lt;b&gt;签证政策&lt;/b&gt;几乎每月都在变，列表中的签证字段只作起点，正式申请请以当地移民局官网为准。&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;月成本&lt;/b&gt;会受汇率、通胀与季节影响，仅作预算量级参考，不等于真实开销。&lt;/li&gt;
      &lt;li&gt;&lt;b&gt;评分&lt;/b&gt;是社区共识，不是绝对答案；样本越多越接近真实体感，欢迎补刀。&lt;/li&gt;
    &lt;/ul&gt;
  &lt;/div&gt;

  &lt;div style=&quot;margin-top:14px; font-size:12px; color:var(--text-3);&quot;&gt;
    想推动一次更新？前往 &lt;a href=&quot;https://github.com/Roloria/global-digital-nomad/issues/new&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;新建 Issue&lt;/a&gt; 或直接点页面顶部「📤 提交城市评分(匿名)」。每一笔贡献都会被记录在 Git 历史里。
  &lt;/div&gt;
&lt;/div&gt;

&lt;div id=&quot;methodology&quot; style=&quot;margin-top:30px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px;&quot;&gt;

// ====== Communities Logic ======
let commSearch = &quot;&quot;;
let commRegion = &quot;&quot;;
let commType = &quot;&quot;;
let commSort = &quot;score&quot;;

function filteredCommunities(){
  let list = [...COMMUNITIES_DATA];
  if(commRegion) list = list.filter(d =&gt; d.region === commRegion);
  if(commType) list = list.filter(d =&gt; d.type === commType);
  if(commSearch){
    const q = commSearch.toLowerCase();
    list = list.filter(d =&gt;
      d.name.toLowerCase().includes(q) ||
      d.nameEn.toLowerCase().includes(q) ||
      d.city.toLowerCase().includes(q) ||
      d.country.toLowerCase().includes(q) ||
      d.intro.toLowerCase().includes(q)
    );
  }
  if(commSort === &quot;score&quot;) list.sort((a,b) =&gt; b.score - a.score);
  else if(commSort === &quot;name&quot;) list.sort((a,b) =&gt; a.name.localeCompare(b.name, &quot;zh&quot;));
  else if(commSort === &quot;capacity&quot;) list.sort((a,b) =&gt; b.capacity - a.capacity);
  return list;
}

function escComm(s){
  return String(s||&quot;&quot;).replace(/[&amp;&lt;&gt;&quot;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;}[c]));
}

function communityCardHTML(d){

  const safeEmail = d.email &amp;&amp; d.email !== &quot;-&quot; ? d.email : &quot;&quot;;
  const safeSocial = d.social &amp;&amp; d.social !== &quot;-&quot; ? d.social : &quot;&quot;;
  const urlLink = safeUrl
    ? `&lt;a href=&quot;${escComm(safeUrl)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; class=&quot;cc-link&quot;&gt;🌐 官网&lt;/a&gt;`
    : `&lt;span class=&quot;cc-link disabled&quot;&gt;🌐 官网&lt;/span&gt;`;
  const emailLink = safeEmail
    ? `&lt;a href=&quot;mailto:${escComm(safeEmail)}&quot; class=&quot;cc-link&quot;&gt;✉️ 联系&lt;/a&gt;`
    : `&lt;span class=&quot;cc-link disabled&quot;&gt;✉️ 联系&lt;/span&gt;`;
  const socialLink = safeSocial
    ? `&lt;a href=&quot;${escComm(safeSocial)}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; class=&quot;cc-link&quot;&gt;💬 社群&lt;/a&gt;`
    : `&lt;span class=&quot;cc-link disabled&quot;&gt;💬 社群&lt;/span&gt;`;

  return `
    &lt;div class=&quot;community-card&quot;&gt;
      &lt;div class=&quot;cc-head&quot;&gt;
        &lt;span class=&quot;cc-flag&quot;&gt;${d.flag}&lt;/span&gt;
        &lt;div class=&quot;cc-titles&quot;&gt;
          &lt;div class=&quot;cc-name&quot;&gt;${escComm(d.name)}&lt;/div&gt;
          &lt;div class=&quot;cc-name-en&quot;&gt;${escComm(d.nameEn)}&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;cc-score&quot; title=&quot;综合分 (0-10)&quot;&gt;${d.score.toFixed(1)}&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;cc-meta&quot;&gt;
        &lt;span class=&quot;cc-type ${d.type}&quot;&gt;${escComm(d.type)}&lt;/span&gt;
        &lt;span class=&quot;cc-loc&quot;&gt;${escComm(d.city)} · ${escComm(d.country)} &lt;span class=&quot;pill ${d.region}&quot;&gt;${d.region}&lt;/span&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;cc-intro&quot;&gt;${escComm(d.intro)}&lt;/div&gt;
      &lt;dl class=&quot;cc-fields&quot;&gt;
        &lt;dt&gt;月费&lt;/dt&gt;&lt;dd&gt;${escComm(d.price)}&lt;/dd&gt;
        &lt;dt&gt;容量&lt;/dt&gt;&lt;dd&gt;${d.capacity &gt;= 1000 ? d.capacity.toLocaleString()+&quot;+&quot; : d.capacity} 人&lt;/dd&gt;
        &lt;dt&gt;政策&lt;/dt&gt;&lt;dd&gt;${escComm(d.policy)}&lt;/dd&gt;
      &lt;/dl&gt;
      &lt;div class=&quot;cc-links&quot;&gt;
        ${urlLink}
        ${emailLink}
        ${socialLink}
      &lt;/div&gt;
    &lt;/div&gt;
  `;
}

function renderCommunityStats(){
  const stats = document.getElementById(&quot;comm-stats&quot;);
  if(!stats) return;
  const total = COMMUNITIES_DATA.length;
  const regionCounts = {};
  const typeCounts = {};
  for(const c of COMMUNITIES_DATA){
    regionCounts[c.region] = (regionCounts[c.region]||0) + 1;
    typeCounts[c.type] = (typeCounts[c.type]||0) + 1;
  }
  const topRegion = Object.entries(regionCounts).sort((a,b)=&gt;b[1]-a[1])[0];
  const topType = Object.entries(typeCounts).sort((a,b)=&gt;b[1]-a[1])[0];
  const highest = [...COMMUNITIES_DATA].sort((a,b)=&gt;b.score-a.score)[0];
  stats.innerHTML = `
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;l&quot;&gt;收录社区&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${total}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${COMM_REGIONS.length} 大区域&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;l&quot;&gt;最多区域&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${topRegion[0]}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${topRegion[1]} 个社区&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;l&quot;&gt;最多类型&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${topType[0]}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${topType[1]} 个社区&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;stat&quot;&gt;&lt;div class=&quot;l&quot;&gt;综合最高&lt;/div&gt;&lt;div class=&quot;v&quot;&gt;${highest.score.toFixed(1)}&lt;/div&gt;&lt;div class=&quot;s&quot;&gt;${highest.name} · ${highest.city}&lt;/div&gt;&lt;/div&gt;
  `;
}

function renderCommunities(){
  const list = filteredCommunities();
  const grid = document.getElementById(&quot;comm-grid&quot;);
  if(!grid) return;
  if(!list.length){
    grid.innerHTML = `&lt;div class=&quot;empty&quot; style=&quot;grid-column:1/-1;&quot;&gt;没有匹配的社区&lt;/div&gt;`;
    return;
  }
  grid.innerHTML = list.map(communityCardHTML).join(&quot;&quot;);
}

// ====== Community Experience Modal Logic ======
function populateCommSelect(){
  const sel = document.getElementById(&quot;comm-select&quot;);
  if(!sel) return;
  const sorted = [...COMMUNITIES_DATA].sort((a,b)=&gt;a.name.localeCompare(b.name, &quot;zh&quot;));
  sel.innerHTML = &#x27;&lt;option value=&quot;&quot;&gt;— 选择一个社区 —&lt;/option&gt;&#x27; +
    sorted.map(c =&gt; `&lt;option value=&quot;${c.name} (${c.city}, ${c.country})&quot;&gt;${c.name} · ${c.city} · ${c.country}&lt;/option&gt;`).join(&quot;&quot;);
}

function openCommModal(){
  document.getElementById(&quot;comm-modal-overlay&quot;).classList.add(&quot;open&quot;);
  populateCommSelect();
  const cb = document.getElementById(&quot;comm-today-date&quot;);
  if(cb){
    const d = new Date();
    cb.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,&quot;0&quot;)}-${String(d.getDate()).padStart(2,&quot;0&quot;)}`;
  }
}
function closeCommModal(){
  document.getElementById(&quot;comm-modal-overlay&quot;).classList.remove(&quot;open&quot;);
}

document.getElementById(&quot;btn-share-community&quot;).addEventListener(&quot;click&quot;, openCommModal);
document.getElementById(&quot;comm-modal-close&quot;).addEventListener(&quot;click&quot;, closeCommModal);

document.getElementById(&quot;comm-search&quot;).addEventListener(&quot;input&quot;, e =&gt; { commSearch = e.target.value; renderCommunities(); });
document.getElementById(&quot;comm-region&quot;).addEventListener(&quot;change&quot;, e =&gt; { commRegion = e.target.value; renderCommunities(); });
document.getElementById(&quot;comm-type&quot;).addEventListener(&quot;change&quot;, e =&gt; { commType = e.target.value; renderCommunities(); });
document.getElementById(&quot;comm-sort&quot;).addEventListener(&quot;change&quot;, e =&gt; { commSort = e.target.value; renderCommunities(); });

// Rating range live update
const _commRatingRange = document.getElementById(&quot;comm-rating-range&quot;);
const _commRatingVal = document.getElementById(&quot;comm-rating-val&quot;);
if(_commRatingRange){
  _commRatingRange.addEventListener(&quot;input&quot;, () =&gt; {
    if(_commRatingVal) _commRatingVal.textContent = parseFloat(_commRatingRange.value).toFixed(1);
  });

document.getElementById(&quot;comm-submit-form&quot;).addEventListener(&quot;submit&quot;, e =&gt; {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const data = {
    type: &quot;community_experience&quot;,
    timestamp: new Date().toISOString(),
    community: (fd.get(&quot;community&quot;) || &quot;&quot;).trim(),
    exp_type: (fd.get(&quot;exp_type&quot;) || &quot;&quot;).trim(),
    season: (fd.get(&quot;season&quot;) || &quot;&quot;).trim(),
    pros: (fd.get(&quot;pros&quot;) || &quot;&quot;).trim(),
    cons: (fd.get(&quot;cons&quot;) || &quot;&quot;).trim(),
    rating: parseFloat(fd.get(&quot;rating&quot;)) || 0,
    extra: (fd.get(&quot;extra&quot;) || &quot;&quot;).trim(),
    last_updated: fd.get(&quot;最后更新&quot;)
  };

  // 基础前端校验
  if (!data.community) { alert(&quot;请选择一个社区&quot;); return; }
  if (!data.exp_type) { alert(&quot;请选择体验类型&quot;); return; }

  // 显示 loading
  const submitBtn = form.querySelector(&#x27;button[type=&quot;submit&quot;]&#x27;);
  const oldText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = &quot;⏳ 提交中...&quot;;

  // 优先 POST 到 API；失败时回退到本地保存 + Issue 直链
  submitCommunityExperience(data)
    .then(result =&gt; {
      showCommSuccess(data, result);
    })
    .catch(err =&gt; {
      console.warn(&quot;[community-experience] API submit failed, falling back to local:&quot;, err);
      // 兜底：仍写入本地存储，让用户可手动跳 Issue（永远不让用户卡住）
      saveCommunityExperienceLocal(data);
      showCommSuccess(data, { mode: &quot;fallback&quot;, error: err.message });
    })
    .finally(() =&gt; {
      submitBtn.disabled = false;
      submitBtn.textContent = oldText;
    });
});

async function submitCommunityExperience(data) {
  // 没有配置 API → 直接走本地 fallback
  if (!COMMUNITY_API_URL) {
    throw new Error(&quot;COMMUNITY_API_URL not configured&quot;);
  }

  const res = await fetch(COMMUNITY_API_URL, {
    method: &quot;POST&quot;,
    headers: { &quot;Content-Type&quot;: &quot;application/json&quot; },
    body: JSON.stringify(data)
  });

  // 先尝试解析 JSON（即使非 200，API 也返回 JSON 错误体）
  let payload = null;
  try { payload = await res.json(); } catch {}

  if (!res.ok || !payload || !payload.ok) {
    const msg = (payload &amp;&amp; payload.error) || `HTTP ${res.status}`;
    const detail = (payload &amp;&amp; payload.details &amp;&amp; payload.details.join(&quot;; &quot;)) || &quot;&quot;;
    throw new Error(detail ? `${msg}: ${detail}` : msg);
  }
  return { mode: &quot;api&quot;, issue_number: payload.issue_number, issue_url: payload.issue_url };
}

(function restoreStoredRate(){

}
function setRate(r){
  const v = parseFloat(r);
  if(!isFinite(v) || v &lt;= 0) return;
  customRate = Math.round(v * 100) / 100;
  rateSource = &quot;manual&quot;;
  rateUpdatedAt = null;
  rateSourceUrl = &quot;&quot;;
  try {
    localStorage.setItem(&quot;nomad_rate_source&quot;, &quot;manual&quot;);
    localStorage.setItem(&quot;nomad_rate&quot;, String(customRate));
  } catch(e){}
  refreshAll();
}
function resetRateToAuto(){
  rateSource = &quot;auto&quot;;
  rateUpdatedAt = null;

  try { localStorage.setItem(&quot;nomad_rate_source&quot;, &quot;auto&quot;); } catch(e){}
  fetchAndApplyRate();
}
function effectiveRate(){ return customRate || DEFAULT_RATE; }
function refreshAll(){
  renderCurrency();

async function fetchAndApplyRate(){
  try {
    const res = await fetch(&quot;data/exchange-rate.json&quot;, { cache: &quot;no-store&quot; });
    if(!res.ok) throw new Error(&quot;HTTP &quot; + res.status);
    const data = await res.json();
    const r = parseFloat(data.rate);
    const updated = new Date(data.updated_at);
    if(!isFinite(r) || r &lt;= 0 || isNaN(updated.getTime())) throw new Error(&quot;bad data&quot;);
    // 只接受 45 天内的数据(防 stale)
    const ageDays = (Date.now() - updated.getTime()) / 86400000;
    if (ageDays &gt; 45) throw new Error(&quot;data is &quot; + Math.round(ageDays) + &quot; days old&quot;);
    customRate = Math.round(r * 100) / 100;
    rateUpdatedAt = data.updated_at;
    rateSourceUrl = data.source || &quot;&quot;;
  } catch(e){
    console.warn(&quot;[nomad-rate] auto fetch failed:&quot;, e.message);
    if (rateSource === &quot;auto&quot; &amp;&amp; !rateUpdatedAt) {
      // keep DEFAULT_RATE
    }
  }
  rateAutoFetchDone = true;
  refreshAll();
}

    // Loading or other transient state - keep silent
    el.innerHTML = &quot;&quot;;
    el.title = &quot;&quot;;
  }
}

function filtered(){

  if(currentRank !== &quot;all&quot;) list = list.filter(d =&gt; d[&quot;排名&quot;] &lt;= parseInt(currentRank));
  if(currentSearch){
    const q = currentSearch.toLowerCase();

  }
  list.sort((a,b) =&gt; {
    const av = a[sortKey], bv = b[sortKey];
    if(typeof av === &quot;string&quot;){
      return av.localeCompare(bv) * sortDir;
    }
    return (av - bv) * sortDir;
  });
  return list;
}

function ageDays(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  if(isNaN(d)) return null;
  const now = new Date();
  return Math.max(0, Math.floor((now - d) / 86400000));
}

function render(){
  const list = filtered();
  const tbody = document.getElementById(&quot;tbody&quot;);
  if(!list.length){
    tbody.innerHTML = `&lt;tr&gt;&lt;td colspan=&quot;14&quot;&gt;&lt;div class=&quot;empty&quot;&gt;没有匹配的城市&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`;
    return;
  }
  tbody.innerHTML = list.map(rowHTML).join(&quot;&quot;);
  tbody.querySelectorAll(&quot;tr[data-i]&quot;).forEach(tr =&gt; {
    tr.addEventListener(&quot;click&quot;, () =&gt; {
      const i = parseInt(tr.getAttribute(&quot;data-i&quot;));
      expanded = (expanded === i) ? null : i;
      render();
    });

  document.querySelectorAll(&quot;th[data-sort]&quot;).forEach(th =&gt; {
    const arrow = th.querySelector(&quot;.arrow&quot;);
    if(th.getAttribute(&quot;data-sort&quot;) === sortKey){
      arrow.textContent = sortDir &gt; 0 ? &quot;↑&quot; : &quot;↓&quot;;
    } else {
      arrow.textContent = &quot;↕&quot;;
    }
  });
}

    &lt;div class=&quot;score-row&quot; data-key=&quot;${f.key}&quot;&gt;

function collectForm(){
  const form = document.getElementById(&quot;submit-form&quot;);
  const fd = new FormData(form);
  const data = {
    type: &quot;submission&quot;,
    timestamp: new Date().toISOString(),
    city: fd.get(&quot;city&quot;),
    country: fd.get(&quot;country&quot;),
    region: fd.get(&quot;region&quot;),
    description: fd.get(&quot;description&quot;),
    sources: fd.get(&quot;sources&quot;),
    scores: {}
  };
  document.querySelectorAll(&quot;.score-range&quot;).forEach(r =&gt; {
    data.scores[r.getAttribute(&quot;data-key&quot;)] = parseFloat(r.value);
  });
  return data;
}

document.getElementById(&quot;submit-form&quot;).addEventListener(&quot;submit&quot;, e =&gt; {
  e.preventDefault();
  const data = collectForm();
  
  // Save to localStorage
  const KEY = &quot;nomad_submissions&quot;;
  const existing = JSON.parse(localStorage.getItem(KEY) || &quot;[]&quot;);
  existing.push(data);
  localStorage.setItem(KEY, JSON.stringify(existing));
  
  showSuccess(data);
});

function showSuccess(data){
  const form = document.getElementById(&quot;submit-form&quot;);
  const box = document.getElementById(&quot;submit-success&quot;);
  form.style.display = &quot;none&quot;;
  
  // Compute overall
  const wsum = SCORE_FIELDS.reduce((s,f) =&gt; s + f.weight, 0);
  const overall = (Object.entries(data.scores).reduce((s,[k,v]) =&gt; {
    const f = SCORE_FIELDS.find(x =&gt; x.key === k);
    return s + v * (f ? f.weight : 0);
  }, 0) / wsum).toFixed(1);
  
  // GitHub Issue URL with prefilled body
  const issueTitle = `[数据提交] ${data.city} (${data.country})`;
  const issueBody = `## 数据提交

**城市**：${data.city}
**国家**：${data.country}
**区域**：${data.region}

### 描述
${data.description || &#x27;(无)&#x27;}

### 数据来源
${data.sources || &#x27;(无)&#x27;}

### 评分（满分 10）
${SCORE_FIELDS.map(f =&gt; `- **${f.label}** (${f.key})：${data.scores[f.key]}`).join(&#x27;\n&#x27;)}

### 综合分（自动计算）
${overall}

---
**最后更新**：${data[&quot;最后更新&quot;] || new Date().toISOString().slice(0,10)}

提交时间：${data.timestamp}
提交方式：网页表单（匿名）
`;
  const issueURL = `https://github.com/Roloria/global-digital-nomad/issues/new?title=${encodeURIComponent(issueTitle)}&amp;body=${encodeURIComponent(issueBody)}&amp;labels=data,community`;
  
  box.innerHTML = `
    &lt;div class=&quot;success-box&quot;&gt;
      &lt;h4&gt;✅ 提交已保存到你的浏览器&lt;/h4&gt;
      &lt;p style=&quot;margin:6px 0; color:var(--text-2); font-size:13px;&quot;&gt;
        本次提交的综合分为 &lt;strong style=&quot;color:var(--accent);&quot;&gt;${overall}&lt;/strong&gt;。
        数据已保存到本地存储（&lt;code&gt;localStorage.nomad_submissions&lt;/code&gt;）。
      &lt;/p&gt;
      &lt;p style=&quot;margin:8px 0 4px; font-size:13px;&quot;&gt;🚀 &lt;strong&gt;想要让这份数据进入公开榜单？三步走：&lt;/strong&gt;&lt;/p&gt;
      &lt;ol style=&quot;margin:6px 0; padding-left:24px; font-size:13px; line-height:1.8;&quot;&gt;
        &lt;li&gt;点击下方「提交 GitHub Issue」按钮 → 在 GitHub 上自动创建数据提交工单&lt;/li&gt;
        &lt;li&gt;维护者审核后会合并到 &lt;code&gt;data/digital-nomad-cities.csv&lt;/code&gt;&lt;/li&gt;
        &lt;li&gt;下一个版本发布时你就能看到它了 🎉&lt;/li&gt;
      &lt;/ol&gt;
      &lt;div class=&quot;action-buttons&quot;&gt;
        &lt;a href=&quot;${issueURL}&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; class=&quot;btn&quot;&gt;📤 提交 GitHub Issue&lt;/a&gt;
        &lt;button class=&quot;btn btn-secondary&quot; id=&quot;btn-export&quot;&gt;💾 导出 JSON&lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; id=&quot;btn-another&quot;&gt;➕ 再提交一条&lt;/button&gt;
        &lt;button class=&quot;btn btn-secondary&quot; id=&quot;btn-close-success&quot;&gt;关闭&lt;/button&gt;
      &lt;/div&gt;
      &lt;p style=&quot;margin:10px 0 0; font-size:11px; color:var(--text-3);&quot;&gt;
        💡 提示：已保存 &lt;span id=&quot;saved-count&quot;&gt;0&lt;/span&gt; 条提交。在浏览器开发者工具的 Application → Local Storage 可以看到全部。
      &lt;/p&gt;
    &lt;/div&gt;
  `;
  box.style.display = &quot;block&quot;;
  document.getElementById(&quot;saved-count&quot;).textContent = JSON.parse(localStorage.getItem(&quot;nomad_submissions&quot;) || &quot;[]&quot;).length;
  
  document.getElementById(&quot;btn-export&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    const all = JSON.parse(localStorage.getItem(&quot;nomad_submissions&quot;) || &quot;[]&quot;);
    const blob = new Blob([JSON.stringify(all, null, 2)], {type: &quot;application/json&quot;});
    const a = document.createElement(&quot;a&quot;);
    a.href = URL.createObjectURL(blob);
    a.download = `nomad-submissions-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  });
  document.getElementById(&quot;btn-another&quot;).addEventListener(&quot;click&quot;, () =&gt; {
    form.reset();
    form.style.display = &quot;block&quot;;
    box.style.display = &quot;none&quot;;
    buildScoreRows();
    document.getElementById(&quot;modal-body&quot;).scrollTop = 0;
  });
  document.getElementById(&quot;btn-close-success&quot;).addEventListener(&quot;click&quot;, closeModal);
}

function setActiveView(view){
  const tabs = document.querySelectorAll(&#x27;.view-tab&#x27;);
  const views = document.querySelectorAll(&#x27;.view&#x27;);
  tabs.forEach(t =&gt; {
    const active = t.dataset.view === view;
    t.classList.toggle(&#x27;active&#x27;, active);
    t.setAttribute(&#x27;aria-selected&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
  });
  views.forEach(v =&gt; {
    v.classList.toggle(&#x27;active&#x27;, v.id === &#x27;view-&#x27; + view);
  });
  // Update page meta
  const titles = {
    cities: &#x27;🌍 全球数字游民城市榜 · 80 城 12 维评分 · 远程办公 &amp; 游民签证指南&#x27;,
    communities: &#x27;🌐 全球数字游民社区地图 · 60 个热门社区 · 联合办公/联合生活/度假村&#x27;
  };
  if(titles[view]) document.title = titles[view];
  try { window.scrollTo({top: 0, behavior: &#x27;instant&#x27;}); } catch(_) { window.scrollTo(0, 0); }
}

document.querySelectorAll(&#x27;.view-tab&#x27;).forEach(tab =&gt; {
  tab.addEventListener(&#x27;click&#x27;, e =&gt; {
    e.preventDefault();
    const view = tab.dataset.view;
    setActiveView(view);
    // Sync URL hash without scrolling
    if (history.replaceState) {
      history.replaceState(null, &#x27;&#x27;, &#x27;#&#x27; + view);
    } else {
      location.hash = &#x27;#&#x27; + view;
    }
  });
});

  const h = (location.hash || &#x27;&#x27;).toLowerCase();
  // 兼容 #communities / #community / 旧 #communit
  if (h.includes(&#x27;communit&#x27;)) return &#x27;communities&#x27;;
  return &#x27;cities&#x27;;
}
setActiveView(getInitialView());

// Sync view on hash change
window.addEventListener(&#x27;hashchange&#x27;, () =&gt; {
  setActiveView(getInitialView());
});
renderCurrency();
renderRateIndicator();

document.getElementById(&quot;seg-usd&quot;).addEventListener(&quot;click&quot;, () =&gt; setCurrency(&quot;USD&quot;));
document.getElementById(&quot;seg-cny&quot;).addEventListener(&quot;click&quot;, () =&gt; setCurrency(&quot;CNY&quot;));

// 自动模式时,加载页面后异步拉一次最新汇率
if (rateSource === &quot;auto&quot;) {
  fetchAndApplyRate();
}
document.getElementById(&quot;rate-value&quot;).addEventListener(&quot;dblclick&quot;, (e) =&gt; {
  if(e.shiftKey) { resetRateToAuto(); return; }
  const cur = effectiveRate().toFixed(2);
  const v = prompt(&quot;1 USD 等于多少 CNY?\n留空用默认 &quot; + DEFAULT_RATE + &quot;。Shift+双击恢复自动。&quot;, cur);
  if(v === null) return;
  if(v.trim() === &quot;&quot;) setRate(DEFAULT_RATE);
  else setRate(v);
});
renderTabs();
renderCountryFilter();
renderMethodology();
render();
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
</body>
</html>
